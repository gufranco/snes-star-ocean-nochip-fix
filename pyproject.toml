[tool.setuptools]
packages = ["starocean"]

[tool.setuptools.dynamic]
version = { attr = "starocean.version.VERSION" }

[tool.setuptools.exclude-package-data]
mapper = ["*.test.py"]

[tool.ruff]
extend-exclude = ["snes-rom-image-python"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"starocean/environment.py" = ["BLE001", "T201"]
"conformance/family.test.py" = ["RUF100"]
"*.test.py" = ["PLR2004", "N999"]
"starocean/doctor.py" = ["BLE001", "T201"]
"starocean/fix.py" = ["T201", "E402"]
"starocean/verify.py" = ["T201", "E402"]
"conformance/links.py" = ["T201"]
"conformance/documents.py" = ["T201"]
"conformance/speed.py" = ["T201"]
"conformance/*.test.py" = ["E402"]
"starocean/*.test.py" = ["E402"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["starocean", "conformance"]

[[tool.mypy.overrides]]
module = ["romimage.*", "romimage.rewrite.*", "mapper.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
source = ["."]
omit = ["snes-rom-image-python/*"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  'if __name__ == "__main__":',
  "def command\\(\\):",
  'if TYPE_CHECKING:',
  '^\s*\.\.\.$',
  ': \.\.\.$',
]
