---
name: Something is wrong
description: A file is refused, the correction writes the wrong bytes, or nothing works at all
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Almost every report here is about one image, and almost every one of
        those is settled by what this package makes of it. The first two fields
        ask for exactly that.

        Never attach an image and never link to one. Its SHA-256 identifies it
        exactly, and that is all anybody needs.

  - type: textarea
    id: doctor
    attributes:
      label: What the doctor says
      description: |
        Run this from the repository and paste every line, including the ones
        that did not pass. Those are the ones worth reading, so do not trim it.

        macOS and Linux:

            python3 -m starocean.doctor

        Windows, whichever of these resolves:

            python -m starocean.doctor
            py -3 -m starocean.doctor

        It reports the machine as well as the package, so most answers are in
        there already. If it will not run at all, say so here and paste whatever
        it printed instead.
      render: text
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: What the verifier makes of your files
      description: |
        Every link of both chains, said as present or absent. It writes nothing.
      render: text
      placeholder: |
        python3 starocean/verify.py
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: |
        the Japanese image should be corrected and written to dist/
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened instead
      description: The exact output or the whole traceback, pasted rather than described.
      render: text
    validations:
      required: true

  - type: input
    id: image
    attributes:
      label: The image, if one is involved
      description: |
        Which edition, which step of the chain, and its SHA-256. Never attach the
        file, and never link to somewhere it can be downloaded.
      placeholder: "japanese, the decompressed image this reads, sha256 ..."

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: The output above is complete rather than trimmed
          required: true
        - label: I own anything I am naming, and I have attached none of it
          required: true
