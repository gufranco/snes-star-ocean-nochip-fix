name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the release tooling
        run: pnpm install --frozen-lockfile

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker
        run: pipx install mypy==1.14.1

      # Strict, with every optional error class the version offers. A model of
      # hardware is masked integers and widths end to end, and a width crossing a
      # boundary it should not is exactly what this catches. The settings live in
      # pyproject.toml so a local run and this one agree.
      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find starocean conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

  speed:
    name: Throughput
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: A megabyte must still digest faster than the floor
        run: python -m conformance.speed

  images:
    name: Images
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Say what is here before touching any of it
        run: |
          # verify exits 0 when what is here matches, 1 when something does not,
          # and 2 when nothing from the chain is here at all. Only 1 is a failure:
          # a hosted runner has none of these files and never will.
          status=0
          python starocean/verify.py roms dist || status="$?"
          if [ "${status}" -eq 1 ]; then
            exit 1
          fi
        shell: bash

      - name: Correct every image present
        run: |
          status=0
          python starocean/fix.py roms dist || status="$?"
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=Images::No image from the chain is present on a hosted runner, so the correction and the re-run were skipped rather than passed. They read two rebuilds of somebody else's patch, confirm each against four digests, correct the header, and confirm the result against four more. Run them locally with copies you own, or point STAR_OCEAN_ROM_DIR at them."
            exit 0
          fi
          exit "${status}"
        shell: bash

      # A correction that is not idempotent is one nobody can safely re-run, and
      # the failure is invisible because both runs write a file of the right
      # length. Comparing what the two runs produced is the cheap way to see it.
      - name: Correct them again and compare what came out
        run: |
          if [ ! -d dist ]; then exit 0; fi
          before=$(python -c 'import hashlib,pathlib,sys; print(*(hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(pathlib.Path("dist").iterdir())))')
          python starocean/fix.py roms dist
          after=$(python -c 'import hashlib,pathlib,sys; print(*(hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(pathlib.Path("dist").iterdir())))')
          if [ "${before}" != "${after}" ]; then
            echo "::error title=Not idempotent::A second run produced different bytes"
            exit 1
          fi
        shell: bash

      - name: Say what is here afterwards
        run: |
          # verify exits 0 when what is here matches, 1 when something does not,
          # and 2 when nothing from the chain is here at all. Only 1 is a failure:
          # a hosted runner has none of these files and never will.
          status=0
          python starocean/verify.py roms dist || status="$?"
          if [ "${status}" -eq 1 ]; then
            exit 1
          fi
        shell: bash
